# Loaded inside nginx's http block. Only the media vhost opts into these formats.
log_format audiograms_summary '$remote_addr - - [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent "-" "-"';
log_format audiograms_detail escape=json
    '{"timestamp":"$time_iso8601","request_id":"$request_id",'
    '"client_ip":"$remote_addr","method":"$request_method",'
    '"path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration_seconds":$request_time,"range":"$http_range",'
    '"content_range":"$sent_http_content_range",'
    '"content_type":"$sent_http_content_type",'
    '"content_length":"$sent_http_content_length"}';
