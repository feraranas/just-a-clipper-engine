/var/log/audiograms-media/*.log {
    daily
    rotate 14
    maxsize 20M
    missingok
    notifempty
    compress
    delaycompress
    create 0640 www-data goaccess-media
    sharedscripts
    postrotate
        /usr/sbin/invoke-rc.d nginx rotate >/dev/null 2>&1
        /usr/bin/systemctl try-restart goaccess-media.service >/dev/null 2>&1
    endscript
}
