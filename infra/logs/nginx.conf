server {
    listen 80;
    listen [::]:80;
    server_name logs.ferarana.work;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://logs.ferarana.work$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name logs.ferarana.work;
    ssl_certificate /etc/letsencrypt/live/logs.ferarana.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logs.ferarana.work/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    root /var/lib/goaccess-media;
    access_log off;
    auth_basic "Media traffic dashboard";
    auth_basic_user_file /etc/nginx/audiograms-logs.htpasswd;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    location = / {
        try_files /report.html =503;
    }
    location = /live {
        proxy_pass http://127.0.0.1:7890;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_read_timeout 1h;
        proxy_buffering off;
    }
    location / { return 404; }
}
