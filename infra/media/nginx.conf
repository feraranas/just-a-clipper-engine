server {
    server_name media.ferarana.work;
    include /etc/nginx/snippets/audiograms-media-access.conf;
    root /srv/audiograms-media/public;
    server_tokens off;
    autoindex off;
    sendfile on;
    max_ranges 1;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }
    location = /templates/classic/v1/ {
        default_type text/html;
        try_files /templates/classic/v1/index.html =404;
    }
    location = /templates/classic/v1/demo.mp4 {
        types { video/mp4 mp4; }
        try_files $uri =404;
    }
    location = /templates/classic/v1/poster.jpg {
        types { image/jpeg jpg; }
        try_files $uri =404;
    }
    location / { return 404; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/media.ferarana.work/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/media.ferarana.work/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = media.ferarana.work) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name media.ferarana.work;
    include /etc/nginx/snippets/audiograms-media-access.conf;
    return 404; # managed by Certbot


}